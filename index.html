<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="מערכת חכמה לניהול ביקורות ופוסטים בגוגל לעסקים." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Revu — ניהול מוניטין חכם</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("agency-theme");
          var dark = theme ? theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
